name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          # Install everything except cupy (no GPU on CI runners)
          grep -v "^cupy" requirements.txt | pip install -r /dev/stdin

      - name: Run tests (CPU-only, GPU tests auto-skip)
        run: |
          python -m pytest tests/ -v --tb=short -rxs

      - name: Smoke-test each src module
        run: |
          python -m src.field
          python -m src.curve
          python -m src.ntt
          python -m src.msm

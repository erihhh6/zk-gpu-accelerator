name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# The workflow only reads the repository; deny everything else to its GITHUB_TOKEN.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run pointless: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Same tools and versions as the pre-commit hooks (both read pyproject.toml)
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # No GPU here: leave code marked "# gpu-only" out of the coverage measurement
      # (both the pytest run and the summary; see [tool.coverage.report] in pyproject.toml)
      ZKGPU_COVERAGE_GPU_ONLY: "# gpu-only"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # One Windows run: gpu_backend's DLL search-path logic only executes there
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (no "gpu" extra; CI runners have no CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check the installed package imports
        run: |
          python -c "import zkgpu; print('zkgpu', zkgpu.__version__)"

      - name: Run tests with coverage (CPU-only, GPU tests auto-skip)
        # Fails below the coverage floor set in pyproject.toml ([tool.coverage.report])
        run: |
          python -m pytest -v --tb=short -rxs --cov

      - name: Coverage summary
        shell: bash  # bash on Windows runners too, for the redirect below
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

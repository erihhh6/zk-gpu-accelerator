# Package metadata and tool configuration (PEP 621).
# Development install from the repo root:
#   pip install -e ".[gpu,bench,dev]"     (leave out "gpu" on machines without CUDA)

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-gpu-accelerator"
dynamic = ["version"]
description = "GPU-accelerated NTT and MSM primitives for zero-knowledge proofs over BN254 (CuPy)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "erihhh6" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
# CuPy wheels for CUDA 12.x. On CUDA 11.x, install cupy-cuda11x yourself and skip this extra.
gpu = ["cupy-cuda12x>=13.0"]
# Plotting for benchmarks/plot_results.py
bench = ["matplotlib>=3.8"]
# Linters are pinned exactly: a new ruff/mypy release can add rules or change
# inference, which should be an explicit upgrade rather than a surprise CI failure.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.1", "mypy==2.4.0", "pre-commit>=4.0"]

[project.urls]
Repository = "https://github.com/erihhh6/zk-gpu-accelerator"

[tool.setuptools.dynamic]
version = { attr = "zkgpu.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110  # the width the existing code was written to
target-version = "py311"
src = ["src", "."]  # first-party code: the zkgpu package plus tests/, benchmarks/, ...
# README examples are hand-aligned for readability; keep the formatter out of them
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # import sorting
    "B",       # bugbear: likely bugs, e.g. zip() silently truncating mismatched inputs
    "UP",      # pyupgrade: syntax for the minimum supported Python
    "SIM",     # simplifications
]

[tool.ruff.lint.isort]
combine-as-imports = true  # keep `import a as b, c` on one line instead of splitting it

[tool.mypy]
files = ["src/zkgpu"]
python_version = "3.11"
strict = true
# mypy's default native parser loads a compiled extension (ast_serialize) that
# Windows Smart App Control blocks on some machines; the pure-Python parser is
# plenty fast for a codebase this size.
native_parser = false

[[tool.mypy.overrides]]
# CuPy ships no type information, and CI installs it not at all
module = ["cupy", "cupy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["zkgpu"]
branch = true

[tool.coverage.report]
show_missing = true
# CI runners have no GPU, so the CUDA code paths never execute there (~83% total;
# ~97% on a GPU machine). This floor guards the CPU and fallback code, with a
# little headroom for platform-specific lines (the Windows DLL-path logic).
fail_under = 82
exclude_also = [
    'raise AssertionError\("unreachable',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unknown markers are errors, so a typo cannot silently bypass the GPU auto-skip
addopts = "--strict-markers"
markers = [
    "gpu: needs a working CUDA GPU; skipped automatically (with the reason) otherwise",
]
